name: col775_a2
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - sysroot_linux-64=2.17          # GLIBC 2.17 workaround on HPC GPU nodes (Piazza FAQ)
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.1
      - torchvision==0.18.1
      - numpy
      - Pillow
      - tqdm
      - scikit-learn
      - matplotlib
      - gdown
